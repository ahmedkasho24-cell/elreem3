<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نوادي الريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --white:#ffffff;
    --gray:#8a8a8a;
    --gray-light:#d4d4d4;
    --gray-soft:#f5f5f5;
    --beige:#d6d6d3;
    --line:rgba(26,26,26,0.1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    overflow:hidden;
  }

  body{
    font-family:'Almarai',sans-serif;
    color:var(--ink);
    background:var(--white);
    line-height:1.6;
  }

  h1,h2{
    font-family:'Tajawal',sans-serif;
    font-weight:900;
    letter-spacing:-0.5px;
  }

  a{color:inherit;text-decoration:none;}

  /* ===== ANIMATIONS ===== */
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }

  @keyframes spinSlow{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  @keyframes spinReverse{
    from{transform:rotate(360deg);}
    to{transform:rotate(0deg);}
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ===== PAGE LAYOUT ===== */
  .page{
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ===== TOP SECTION ===== */
  .top{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    position:relative;
    overflow:hidden;
  }

  /* Decorative circles */
  .deco-circle{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .deco-1{
    width:350px;height:350px;
    top:-120px;right:-120px;
    animation:spinSlow 40s linear infinite;
  }
  .deco-2{
    width:250px;height:250px;
    bottom:-100px;left:-100px;
    animation:spinReverse 35s linear infinite;
  }
  .deco-3{
    width:120px;height:120px;
    top:15%;left:8%;
    border:1px dashed var(--line);
    animation:spinSlow 25s linear infinite;
  }
  .deco-4{
    width:80px;height:80px;
    bottom:20%;right:10%;
    border:1px dashed var(--line);
    animation:spinReverse 20s linear infinite;
  }

  /* Logo */
  .logo-wrap{
    position:relative;
    display:inline-block;
    margin-bottom:20px;
  }
  .logo-ring{
    position:absolute;
    inset:-18px;
    border-radius:50%;
    border:1px solid var(--line);
    animation:spinSlow 25s linear infinite;
  }
  .logo-ring::before{
    content:'';
    position:absolute;
    top:50%;
    right:-4px;
    width:8px;
    height:8px;
    background:var(--gray);
    border-radius:50%;
  }
  .logo-ring-2{
    position:absolute;
    inset:-36px;
    border-radius:50%;
    border:1px dashed var(--line);
    animation:spinReverse 35s linear infinite;
  }
  .logo-ring-2::before{
    content:'';
    position:absolute;
    top:-4px;
    left:50%;
    width:8px;
    height:8px;
    background:var(--beige);
    border-radius:50%;
  }
  .logo{
    width:150px;
    height:150px;
    object-fit:contain;
    position:relative;
    z-index:2;
    animation:float 6s ease-in-out infinite;
  }

  .brand-name{
    font-size:clamp(30px, 4vw, 42px);
    margin-bottom:6px;
    animation:fadeUp .8s ease .2s both;
  }
  .brand-name span{
    color:var(--gray);
  }

  .brand-desc{
    color:var(--gray);
    font-size:14px;
    max-width:400px;
    margin-bottom:30px;
    animation:fadeUp .8s ease .4s both;
  }

  /* ===== SOCIAL BUTTONS (different design) ===== */
  .social-buttons{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    animation:fadeUp .8s ease .6s both;
  }
  .social-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--gray-soft);
    border:1.5px solid var(--gray-light);
    border-radius:14px;
    padding:12px 22px;
    font-weight:800;
    font-size:14px;
    color:var(--ink);
    transition:all .3s;
    min-width:150px;
    justify-content:center;
  }
  .social-btn svg{
    width:20px;
    height:20px;
    fill:var(--gray);
    transition:all .3s;
  }
  .social-btn:hover{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--white);
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,.15);
  }
  .social-btn:hover svg{
    fill:var(--white);
  }

  /* ===== FOOTER (BLACK BAR) ===== */
  footer{
    background:var(--ink);
    color:var(--white);
    padding:20px 32px;
  }
  .footer-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
  }
  .footer-info{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .footer-info a{
    display:flex;
    align-items:center;
    gap:10px;
    color:#cfc9bd;
    font-size:14px;
    font-weight:700;
    transition:color .3s;
  }
  .footer-info a:hover{
    color:var(--beige);
  }
  .footer-info svg{
    width:18px;
    height:18px;
    fill:var(--beige);
  }
  .map-slot{
    width:280px;
    height:120px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.15);
  }
  .map-slot iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width:600px){
    .logo{width:120px;height:120px;}
    .logo-ring{inset:-14px;}
    .logo-ring-2{inset:-28px;}
    .social-btn{
      min-width:130px;
      padding:10px 16px;
      font-size:13px;
    }
    .footer-inner{
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    .footer-info{
      align-items:center;
    }
    .map-slot{
      width:100%;
      max-width:320px;
    }
  }
</style>
</head>
